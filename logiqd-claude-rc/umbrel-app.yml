manifestVersion: 1
id: logiqd-claude-rc
name: Remote Control — Claude y Codex
tagline: Claude Code y Codex en un panel con cuentas independientes
icon: https://raw.githubusercontent.com/LogiQDAdmin/umbrel-app-store/main/logiqd-claude-rc/icon.svg
category: developer
version: "0.2.0"
port: 3781
description: >-
  Una app para gestionar Claude Code y Codex en las carpetas de tu Umbrel.
  Al crear un proyecto eliges Claude, Codex o ambos, con cuentas y supervisión independientes.


  Claude conserva Remote Control por proyecto, terminal, conversaciones y recuperación tras
  un apagado inesperado. Codex añade login oficial por dispositivo, terminal por proyecto y
  app-server con acceso remoto experimental. El panel avisa si un proveedor se cae o cambia
  de formato y sigue disponible aunque no haya una cuenta conectada.


  Ambos CLIs tienen versiones fijadas y actualizaciones automáticas desactivadas.
  Esta actualización conserva los datos y proyectos de Claude RC 0.1.1.


  Si eliges los dos agentes para una misma carpeta, trabaja por turnos: pueden competir por
  los mismos archivos y el índice Git. Para trabajar en paralelo usa carpetas o worktrees distintos.
developer: LogiQD
website: https://github.com/LogiQDAdmin/claude-rc
repo: https://github.com/LogiQDAdmin/claude-rc
support: https://github.com/LogiQDAdmin/claude-rc/issues
gallery: []
releaseNotes: >-
  Añade Codex como proveedor experimental junto a Claude. Mantiene el ID, puerto y datos
  anteriores. Login separado, CLIs fijados, updater apagado, fallos visibles y migración aditiva.
dependencies: []
path: ""
submitter: LogiQD
folderAccess:
  - id: proyectos
    name: Carpeta de proyectos
    note: Cada proyecto elige sus agentes y permisos de confianza. Usa carpetas separadas para edición simultánea.
    mounts:
      - service: web
        targetPath: /projects
