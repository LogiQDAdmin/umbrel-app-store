version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: logiqd-claude-rc_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/logiqd/claude-rc:0.1.0
    restart: on-failure
    # Tiempo para cerrar cada servidor con Ctrl+C: si se corta antes, cuenta como apagón
    stop_grace_period: 45s
    environment:
      RC_NAME_PREFIX: umbrel
      PROJECT_ROOTS: /projects,/data/proyectos
    volumes:
      - ${APP_DATA_DIR}/data:/data
