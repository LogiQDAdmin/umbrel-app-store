version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: logiqd-claude-rc_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/logiqdadmin/claude-rc:0.2.0
    restart: on-failure
    stop_grace_period: 60s
    environment:
      RC_NAME_PREFIX: umbrel
      PROJECT_ROOTS: /projects,/data/proyectos
    volumes:
      - ${APP_DATA_DIR}/data:/data
